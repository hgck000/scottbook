name: ScottBook CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: scottbook-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Core quality and portable PWA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit runtime security and licenses
        run: npm run audit:security

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build PWA
        run: npm run build

      - name: Verify project-subpath PWA
        run: SCOTTBOOK_BASE_PATH=/scottbook/ npm run build

      - name: Upload QA-ready PWA
        uses: actions/upload-artifact@v4
        with:
          name: ScottBook-PWA-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  browser-journeys:
    name: Browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Confirm runner Chrome
        run: google-chrome --version

      - name: Run production browser journeys
        run: npm run test:e2e

      - name: Upload Playwright evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ScottBook-Playwright-${{ github.sha }}
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14

  platform-build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build PWA
        run: npm run build
